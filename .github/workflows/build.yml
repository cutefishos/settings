name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  debian:
    name: Debian
    runs-on: ubuntu-latest
    container: docker.io/library/debian:sid

    steps:
      - name: Prepare checkout
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout settings
        uses: actions/checkout@v4
        with:
          path: settings

      - name: Checkout Cutefish Framework
        uses: actions/checkout@v4
        with:
          repository: cutefishos/cutefish-framework
          ref: main
          path: cutefish-framework

      - name: Install the basic dev packages
        run: |
          apt-get install -y \
            equivs \
            curl \
            devscripts \
            lintian \
            build-essential \
            automake \
            autotools-dev \
            cmake \
            g++

      - name: Install build dependencies
        working-directory: settings
        run: mk-build-deps -i -t "apt-get --yes" -r

      - name: Build Package
        working-directory: settings
        run: dpkg-buildpackage -b -uc -us -j$(nproc)
